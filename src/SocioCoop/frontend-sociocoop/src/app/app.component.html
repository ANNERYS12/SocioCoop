<div style="padding: 20px; font-family: sans-serif;">
  <h1>SocioCoop - Gestión de Socios</h1>
  <hr>
  <h2>Lista de Socios Registrados</h2>
  <ul>
    <li *ngFor="let socio of socios">
      <strong>{{ socio.nombre }}</strong> - Cédula: {{ socio.cedula }} | Balance: RD${{ socio.balanceAportes }}
    </li>
  </ul>
  <p *ngIf="socios.length === 0">No hay socios registrados o cargando desde la API...</p>
</div>
